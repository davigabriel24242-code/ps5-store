name: build-ps5

on:
  workflow_dispatch:
    inputs:
      titleid:
        description: 'Title ID'
        required: false
        default: 'PPSA99100'
      appname:
        description: 'Nome do app'
        required: false
        default: 'pipow-store'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_NAME: ${{ inputs.appname }}
      APP_DIR: ps5-react/apps/${{ inputs.appname }}

    steps:
      - name: Checkout ps5-store
        uses: actions/checkout@v4
        with:
          path: ps5-store

      - name: Checkout ps5-react
        uses: actions/checkout@v4
        with:
          repository: davigabriel24242-code/ps5-react
          path: ps5-react

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install brew deps
        run: brew install cmake sdl2 llvm@18 curl libarchive openssl@3 pkg-config binutils dpkg

      - name: Prefer GNU ar (macOS BSD ar truncates large .deb members)
        run: |
          /opt/homebrew/opt/binutils/bin/ar --version | head -1
          echo "/opt/homebrew/opt/binutils/bin" >> "$GITHUB_PATH"

      - name: Install Python deps (Pillow)
        run: |
          python -m pip install --upgrade pip Pillow
          python -c "from PIL import Image; print('Pillow setup-python OK')"
          /opt/homebrew/bin/python3 -m pip install --break-system-packages Pillow
          /opt/homebrew/bin/python3 -c "from PIL import Image; print('Pillow homebrew OK')"

      - name: Cache deps externas
        uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: deps-macos14-${{ hashFiles('ps5-react/tools/**', 'ps5-react/package-lock.json') }}

      - name: Install npm deps
        working-directory: ps5-react
        run: npm ci

      - name: Doctor
        working-directory: ps5-react
        run: npm run doctor
        continue-on-error: true

      - name: Create app scaffold
        working-directory: ps5-react
        run: |
          if [ -d "apps/$APP_NAME" ]; then
            echo "app $APP_NAME ja existe, pulando create"
          else
            npm run create -- --name "$APP_NAME" --title-id "${{ inputs.titleid }}"
          fi

      - name: Copy JSX source
        run: |
          DEST="$APP_DIR"
          [ -d "$APP_DIR/src" ] && DEST="$APP_DIR/src"
          for f in index.jsx catalog.js platform.jsx; do
            cp "ps5-store/apps/pipow-store/$f" "$DEST/$f"
          done

      - name: Copy assets
        run: |
          mkdir -p "$APP_DIR/assets" "$APP_DIR/covers"
          for f in logo.png hero.png; do
            cp "ps5-store/assets/$f" "$APP_DIR/assets/" || echo "::warning::asset $f nao encontrado"
          done
          cp ps5-store/covers/*.jpg "$APP_DIR/covers/" 2>/dev/null || echo "::warning::nenhuma capa .jpg encontrada"

      - name: Build
        shell: bash
        run: |
          export PATH="/opt/homebrew/opt/binutils/bin:/opt/homebrew/opt/llvm@18/bin:$PATH"
          echo "ar: $(which ar)"
          echo "python3: $(which python3)"
          python3 -m pip install --quiet Pillow || python3 -m pip install --quiet --break-system-packages Pillow
          python3 -c "from PIL import Image; print('Pillow OK')"
          cd ps5-react
          npm run build -- --app "$APP_NAME"

      - name: List dist
        if: always()
        run: find ps5-react/dist -type f 2>/dev/null | head -50 || echo "sem dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appname }}-build
          path: ps5-react/dist/
          if-no-files-found: warn
          retention-days: 30
